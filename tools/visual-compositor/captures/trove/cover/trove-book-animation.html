<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trove — book animation</title>
<style>
:root{--coral:#ea6a2e;--dark:#c94f1f;--paper:#ffffff;--paper2:#fee9c9;--ink:#713523;--blue:#6db7c5;--orange:#ed9950;--yellow:#f5c35b;--green:#74a96f;--bg:#fff9ef}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{position:relative;width:min(94vw,760px);aspect-ratio:1.28;display:grid;place-items:center;perspective:1500px;cursor:pointer}.ground{position:absolute;left:27%;right:27%;bottom:12%;height:11%;border-radius:50%;background:#7135232b;filter:blur(22px);animation:ground 5.4s ease both}.book{position:relative;width:42%;height:66%;transform-style:preserve-3d;animation:book 5.4s cubic-bezier(.22,.75,.18,1) both}.board,.leaf,.stack{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;border-radius:8px 18px 18px 8px}.back-cover{background:var(--dark);transform:translateZ(-14px);box-shadow:0 18px 30px #71352330}.stack{inset:5px 5px 5px 0;background:repeating-linear-gradient(to bottom,var(--paper) 0 4px,#efd2a8 5px 6px);transform:translateZ(-8px)}.cover{z-index:20;background:var(--coral);color:#fff8ea;box-shadow:8px 18px 28px #71352335;animation:cover 5.4s cubic-bezier(.4,.02,.16,1) both}.cover-art{position:absolute;inset:0;padding:13% 11%;backface-visibility:hidden;background:var(--coral);border-radius:8px 18px 18px 8px}.cover-art:after,.face:after{content:"";position:absolute;inset:0 auto 0 0;width:11%;border-radius:8px 0 0 8px;background:linear-gradient(90deg,#5b211e2b,transparent);pointer-events:none}.kicker{font-size:clamp(8px,1.1vw,12px);letter-spacing:.18em;font-weight:750;opacity:.72}.wordmark{margin-top:7%;font-family:Inter,ui-sans-serif,sans-serif;font-size:clamp(42px,7vw,72px);line-height:.9;letter-spacing:-.065em;font-weight:760}.rule{width:38%;height:6px;margin-top:12%;border-radius:20px;background:var(--yellow)}.rule.short{width:24%;margin-top:4%;opacity:.55}.facepile{position:absolute;left:11%;bottom:10%;display:flex;align-items:center}.avatar{position:relative;width:clamp(28px,5vw,44px);aspect-ratio:1;margin-left:-9px;overflow:hidden;border:3px solid var(--coral);border-radius:50%;background:var(--skin)}.avatar:first-child{margin-left:0}.avatar:before{content:"";position:absolute;left:5%;right:5%;top:-5%;height:48%;border-radius:50%;background:var(--hair)}.avatar:after{content:"••";position:absolute;left:0;right:0;top:34%;text-align:center;font-size:45%;letter-spacing:.13em;color:#2b1c18}.a{--skin:#6f3d28;--hair:#241814}.b{--skin:#d99569;--hair:#4a2b20}.c{--skin:#9e5c3d;--hair:#172a30}.social-copy{margin-left:8px;max-width:92px;font-size:clamp(7px,1vw,11px);line-height:1.15;font-weight:700;color:#fff8eacc}.leaf{z-index:10}.leaf.one{z-index:14;animation:leaf1 5.4s cubic-bezier(.42,.03,.18,1) both}.leaf.two{z-index:13;animation:leaf2 5.4s cubic-bezier(.42,.03,.18,1) both}.leaf.three{z-index:12;animation:leaf3 5.4s cubic-bezier(.42,.03,.18,1) both}.leaf.four{z-index:11;animation:leaf4 5.4s cubic-bezier(.42,.03,.18,1) both}.face{position:absolute;inset:0;padding:12% 11%;overflow:hidden;border-radius:8px 18px 18px 8px;background:var(--paper);box-shadow:4px 7px 17px #7135231a;backface-visibility:hidden}.face.back{transform:rotateY(180deg);background:var(--paper2)}.page-title{font-size:clamp(8px,1.15vw,13px);letter-spacing:.11em;font-weight:850;color:var(--coral)}.line{height:7px;margin-top:8%;border-radius:20px;background:#efc89b}.line.short{width:60%;margin-top:4%}.art{position:absolute;left:13%;right:11%;bottom:10%;height:45%;overflow:hidden;border-radius:11px;background:#f6dfbe;transform:rotate(var(--tilt,-2deg))}.bag{position:absolute;left:27%;bottom:3%;width:48%;height:65%;border-radius:5px 5px 14px 14px;background:#e4a552;box-shadow:inset 0 -10px #ca7c35}.bag:before{content:"";position:absolute;left:16%;right:16%;top:-31%;height:45%;border:7px solid #c77e36;border-bottom:0;border-radius:50% 50% 0 0}.produce{position:absolute;border-radius:50%;z-index:2}.apple{width:25%;aspect-ratio:1;left:19%;top:15%;background:#e55743}.leafy{width:25%;height:14%;left:40%;top:7%;background:var(--green);transform:rotate(-25deg)}.carrot{width:14%;height:42%;right:18%;top:8%;border-radius:50% 50% 65% 65%;background:#ed8741;transform:rotate(20deg)}.jars{position:absolute;inset:17% 12% 8%;display:flex;align-items:flex-end;gap:8%}.jar{flex:1;height:70%;border-radius:6px 6px 13px 13px;background:#75b5bd;box-shadow:inset 0 -16px #51939e}.jar:nth-child(2){height:90%;background:#e8a354;box-shadow:inset 0 -16px #cd7736}.jar:before{content:"";display:block;height:13%;margin:-7% -3% 0;border-radius:3px;background:#713523}.cards{position:absolute;inset:14%}.card{position:absolute;inset:8% 0;border-radius:9px;background:#77b8c2;box-shadow:0 7px #4f929e;transform:rotate(-8deg)}.card:nth-child(2){background:#f0ae59;box-shadow:0 7px #d57b36;transform:rotate(7deg)}.card:after{content:"♥";position:absolute;right:10%;top:8%;font-size:clamp(18px,3vw,30px);color:#fff4dc}.toast{position:absolute;left:25%;top:20%;width:50%;height:60%;border-radius:38% 38% 17% 17%;background:#d68c43;box-shadow:inset 0 0 0 9px #efbd72}.toast:after{content:"";position:absolute;left:19%;right:19%;top:20%;bottom:16%;border-radius:50% 50% 44% 44%;background:#73a969}.calendar{position:absolute;inset:12%;display:grid;grid-template-columns:repeat(2,1fr);gap:8%;padding-top:13%}.calendar:before{content:"";position:absolute;left:0;right:0;top:0;height:11%;border-radius:6px;background:var(--coral)}.day{border-radius:7px;background:#f2b667;box-shadow:inset 0 -7px #d8833d55}.pot{position:absolute;left:25%;top:28%;width:50%;height:43%;border-radius:5px 5px 25px 25px;background:#6db7c5;box-shadow:inset 0 -12px #4b929f}.pot:before{content:"";position:absolute;left:-7%;right:-7%;top:-12%;height:19%;border-radius:50%;background:#397c8d}.pot:after{content:"";position:absolute;left:-32%;right:-32%;top:13%;height:14%;border-radius:20px;background:#397c8d;z-index:-1}.steam{position:absolute;left:32%;top:4%;width:36%;height:25%;border:5px solid #efb66e;border-top:0;border-bottom:0;border-radius:50%}.cookies{position:absolute;inset:12%}.cookie{position:absolute;width:43%;aspect-ratio:1;border-radius:50%;background:#e89a4b;box-shadow:inset -8px -8px #ce742f}.cookie:after{content:"•  •\A •  •";white-space:pre;position:absolute;inset:24%;font-size:clamp(10px,1.7vw,16px);line-height:1.4;color:#713523}.cookie:first-child{left:7%;bottom:8%;transform:rotate(-12deg)}.cookie:last-child{right:7%;top:7%;transform:scale(.82) rotate(8deg)}.market{position:absolute;inset:10%}.market .apple{left:10%;top:35%;width:35%}.market .carrot{right:15%;top:18%;width:18%;height:62%}.market:after{content:"";position:absolute;left:38%;top:4%;width:30%;height:22%;border-radius:50% 0 50% 0;background:var(--green);transform:rotate(-18deg)}.plate{position:absolute;width:64%;aspect-ratio:1;left:18%;top:8%;border-radius:50%;background:#fff5df;box-shadow:0 0 0 12px #6db7c5}.plate:before{content:"";position:absolute;width:50%;aspect-ratio:1;left:25%;top:25%;border-radius:50%;background:#ef9c4e}.plate:after{content:"";position:absolute;width:28%;height:16%;left:36%;top:18%;border-radius:50% 0 50% 0;background:var(--green);transform:rotate(-18deg)}.replay{position:absolute;right:2%;bottom:2%;border:0;border-radius:999px;padding:10px 15px;background:#71352312;color:var(--ink);font:700 12px/1 Inter,system-ui;cursor:pointer}
/* Editorial page compositions */
.line.third{width:42%;margin-top:4%}.image-first .art{top:10%;bottom:auto;height:48%}.image-first .page-title{position:absolute;left:11%;bottom:27%}.image-first>.line{position:absolute;left:11%;right:11%;bottom:19%}.image-first>.line.short{right:36%;bottom:14%}.image-first>.line.third{right:52%;bottom:9%}.split .art{left:48%;right:9%;top:19%;bottom:16%;height:auto}.split>.line{width:29%;margin-top:12%}.split>.line.short{width:22%;margin-top:5%}.split>.line.third{width:17%}.hero .art{inset:15% 12% 12%;height:auto}.hero .page-title{position:relative;z-index:3;color:var(--coral)}.hero>.line{display:none}
/* Licensed illustration placement */
.food-illo{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
/* Extra illustration detail */
.bag:after{content:"";position:absolute;left:22%;right:22%;top:28%;height:5px;border-radius:8px;background:#fff5df99;box-shadow:0 11px #fff5df70}.jar:after{content:"";display:block;width:56%;height:18%;margin:35% auto 0;border-radius:4px;background:#fff5dfb8}.calendar .day:after{content:"•  •";display:block;margin:15% 12%;font-size:clamp(7px,1vw,11px);letter-spacing:.2em;color:#b65d30}.cards .card:first-child:before{content:"";position:absolute;left:9%;top:12%;width:38%;height:45%;border-radius:6px;background:#f6d099}.cards .card:nth-child(2):before{content:"";position:absolute;left:9%;top:12%;width:38%;height:45%;border-radius:6px;background:#7bb08a}.toast:before{content:"✦  ✦  ✦";position:absolute;left:25%;top:33%;z-index:2;font-size:clamp(7px,1vw,11px);color:#e7d07c}.pot .veg{position:absolute;width:17%;aspect-ratio:1;top:-18%;border-radius:50%;background:#e85f45}.pot .veg:nth-child(2){left:22%;background:#75a96f}.pot .veg:nth-child(3){right:18%;background:#f0ae59}.plate{box-shadow:0 0 0 12px #6db7c5,0 10px 18px #71352324}.cookie{background:radial-gradient(circle at 32% 28%,#713523 0 4%,transparent 5%),radial-gradient(circle at 68% 38%,#713523 0 4%,transparent 5%),radial-gradient(circle at 42% 70%,#713523 0 4%,transparent 5%),#e89a4b}
/* Return turned sheets in reverse order, then close and recenter the cover. */
@keyframes book{0%,9%,100%{transform:rotateX(15deg) rotateY(-8deg) rotateZ(-8deg) translateX(0) scale(.92)}20%,87%{transform:rotateX(15deg) rotateY(-8deg) rotateZ(-4deg) translateX(50%) scale(.88)}96%{transform:rotateX(15deg) rotateY(-8deg) rotateZ(-8deg) translateX(0) scale(.92)}}@keyframes cover{0%,10%{transform:rotateY(0);z-index:20}20%,87%{transform:rotateY(-179deg);z-index:0}95%,100%{transform:rotateY(0);z-index:20}}@keyframes leaf1{0%,21%{transform:rotateY(0)}29%,79%{transform:rotateY(-178deg)}81%,100%{transform:rotateY(0)}}@keyframes leaf2{0%,30%{transform:rotateY(0)}38%,81%{transform:rotateY(-177deg)}83%,100%{transform:rotateY(0)}}@keyframes leaf3{0%,39%{transform:rotateY(0)}47%,83%{transform:rotateY(-176deg)}85%,100%{transform:rotateY(0)}}@keyframes leaf4{0%,48%{transform:rotateY(0)}56%,85%{transform:rotateY(-175deg)}87%,100%{transform:rotateY(0)}}@keyframes ground{0%,9%,100%{left:27%;right:27%;opacity:.55}22%,87%{left:9%;right:9%;opacity:1}96%{left:27%;right:27%;opacity:.55}}@media(prefers-reduced-motion:reduce){.book{animation:none;transform:rotateX(15deg) rotateY(-8deg) rotateZ(-4deg) translateX(50%) scale(.88)}.cover,.leaf{animation:none!important;transform:rotateY(-178deg)}.cover{z-index:0}.ground{animation:none}}
</style></head>
<body><main class="stage" id="stage" aria-label="Trove social recipe book animation"><div class="ground"></div><div class="book"><div class="board back-cover"></div><div class="stack"></div>
<section class="face hero" style="z-index:9"><div class="page-title">DINNER INSPIRATION</div><div class="art" style="background:#dcecee"><img class="food-illo" src="assets/licensed/Fish Plate.svg" alt=""></div></section>
<section class="leaf four"><div class="face front"><div class="page-title">RECIPE</div><div class="line"></div><div class="line short"></div><div class="line third"></div><div class="art"><img class="food-illo" src="assets/licensed/Avocado.svg" alt=""></div></div><div class="face back image-first"><div class="page-title">SEASONAL PICKS</div><div class="line"></div><div class="line short"></div><div class="art" style="background:#dcebd9"><img class="food-illo" src="assets/licensed/Berries.svg" alt=""></div></div></section>
<section class="leaf three"><div class="face front split"><div class="page-title">MEAL PLAN</div><div class="line"></div><div class="line short"></div><div class="line third"></div><div class="art"><img class="food-illo" src="assets/licensed/Salad.svg" alt=""></div></div><div class="face back hero"><div class="page-title">COOK TOGETHER</div><div class="art" style="background:#dcecee"><img class="food-illo" src="assets/licensed/Fried Eggs.svg" alt=""></div></div></section>
<section class="leaf two"><div class="face front image-first"><div class="page-title">GROCERIES</div><div class="line"></div><div class="line short"></div><div class="line third"></div><div class="art"><img class="food-illo" src="assets/licensed/Vegetable Medley.svg" alt=""></div></div><div class="face back image-first"><div class="page-title">YOUR PANTRY</div><div class="line"></div><div class="line short"></div><div class="art" style="background:#e4efdf"><img class="food-illo" src="assets/licensed/Corn Flakes.svg" alt=""></div></div></section>
<section class="leaf one"><div class="face front image-first"><div class="page-title">COLLECTIONS</div><div class="line"></div><div class="line short"></div><div class="line third"></div><div class="art" style="background:#dcecee"><img class="food-illo" src="assets/licensed/Mixed Fruits.svg" alt=""></div></div><div class="face back"><div class="page-title">QUICK BITES</div><div class="line"></div><div class="line short"></div><div class="art"><img class="food-illo" src="assets/licensed/Yogurt.svg" alt=""></div></div></section>
<section class="board cover"><div class="cover-art"><div class="kicker">MAKE MEALS SOCIAL</div><div class="wordmark">Trove</div><div class="rule"></div><div class="rule short"></div><div class="facepile"><span class="avatar a"></span><span class="avatar b"></span><span class="avatar c"></span><span class="social-copy">saved by you and friends</span></div></div></section></div><button class="replay" id="replay" type="button">Replay</button></main>
<script>const stage=document.querySelector('#stage');function restart(e){e?.stopPropagation();stage.querySelectorAll('.book,.cover,.leaf,.ground').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''})}document.querySelector('#replay').addEventListener('click',restart);stage.addEventListener('click',e=>{if(!e.target.closest('.replay'))restart(e)});</script></body></html>
